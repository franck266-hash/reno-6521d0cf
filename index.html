  (ct?'<div class="w">'+cLink(ct)+'</div>':'')+
  '<label class="w">Dépend de<select data-f="dep" data-n="'+r.n+'"><option value="">— Aucune —</option>'+S.filter(m=>!bad.has(m.n)).map(m=>'<option value="'+m.n+'"'+(m.n==r.dep?' selected':'')+'>'+esc(m.n+' '+m.t)+'</option>').join('')+'</select></label>'+
  (r.budgetTxt&&!num(r.prevu)?'<div class="w info">Budget '+esc(r.budgetTxt)+'</div>':'')}
 return x+'<label class="w">Pièce<select data-f="piece" data-n="'+r.n+'"><option value="">'+TE+'</option>'+P.map(q=>'<option'+(q==r.piece?' selected':'')+'>'+esc(q)+'</option>').join('')+'</select></label>'+'<label>Début estimé<input type="date" data-f="estStart" data-n="'+r.n+'" value="'+(r.estStart||'')+'"></label><label>Fin estimée<input type="date" data-f="estEnd" data-n="'+r.n+'" value="'+(r.estEnd||'')+'"></label>'+
 '<label class="w">Durée estimée<span class="info" id="e'+r.n+'" style="min-height:44px;display:flex;align-items:center">'+(dur(r,1)||'—')+'</span></label>'+
 '<label>Début<input type="date" data-f="start" data-n="'+r.n+'" value="'+r.start+'"></label><label>Fin<input type="date" data-f="end" data-n="'+r.n+'" value="'+r.end+'"></label>'+
 '<label>Budget prévu ($)<input type="number" inputmode="decimal" min="0" step="any" data-f="prevu" data-n="'+r.n+'" value="'+esc(r.prevu)+'"></label><label>Dépensé ($)<input type="number" inputmode="decimal" min="0" step="any" data-f="depense" data-n="'+r.n+'" value="'+esc(r.depense)+'"></label>'+
 '<label class="w">Durée réelle<span class="info" id="r'+r.n+'" style="min-height:44px;display:flex;align-items:center">'+(dur(r)||'—')+'</span></label>'+
 '<label class="w">Notes<textarea data-f="note" data-n="'+r.n+'">'+esc(r.note)+'</textarea></label></div>'}
function row(r,main){const dp=main&&r.dep?S.find(m=>m.n==r.dep):null;
 return '<div class="row '+(main?'main':'sub')+(r.done?' done':'')+'"><input type="checkbox" class="ck" data-a="ck" data-n="'+r.n+'" '+(r.done?'checked':'')+' aria-label="Fait">'+
 '<div class="tt"><span class="num">'+r.n+'</span> '+esc(r.t)+(dp?'<div class="info" style="font-weight:400">Après : '+esc(dp.n+' '+dp.t)+'</div>':'')+(main?'<div class="info" style="font-weight:400" id="t'+r.n+'"></div>':'')+'</div><button class="tg" data-a="det" data-n="'+r.n+'" aria-label="Détails">✎</button>'+
 '<button class="tg" data-a="ren" data-n="'+r.n+'" aria-label="Modifier le nom">✏️</button>'+('<button class="tg" data-a="del" data-n="'+r.n+'" aria-label="Supprimer" style="background:#fce8e6;color:#c5221f">🗑</button>')+(main&&r.subs.length?'<button class="tg" data-a="op" data-n="'+r.n+'">'+(open[r.n]?'▲':'▼')+'</button>':'')+'</div>'+det(r,main)}
function contacts(){$('#contacts').innerHTML=C.map(c=>'<div class="card"><div class="row"><div class="tt"><b>'+esc(c.nom||'(sans nom)')+'</b>'+(c.metier?'<div class="info">'+esc(c.metier)+'</div>':'')+'<div>'+cLink(c)+'</div>'+(c.note?'<div class="info">'+esc(c.note)+'</div>':'')+'</div>'+
 '<button class="tg" data-a="cedit" data-n="'+c.id+'" aria-label="Modifier">✏️</button><button class="tg" data-a="cdel" data-n="'+c.id+'" aria-label="Supprimer" style="background:#fce8e6;color:#c5221f">🗑</button></div>'+
 '<div class="det'+(cedit[c.id]?'':' hide')+'">'+[['metier','Métier','text'],['nom','Nom','text'],['tel','Téléphone','tel'],['email','Courriel','email']].map(([k,l,t])=>'<label>'+l+'<input type="'+t+'" data-c="'+k+'" data-n="'+c.id+'" value="'+esc(c[k])+'"></label>').join('')+
 '<label class="w">Note<textarea data-c="note" data-n="'+c.id+'">'+esc(c.note)+'</textarea></label><button class="w p" data-a="cdone" data-n="'+c.id+'">✓ Terminé</button></div></div>').join('')+
 '<div class="card"><div class="row"><button class="p" style="flex:1" data-a="cadd">+ Ajouter un contact</button></div></div>'}
function rooms(){const a=all();$('#rooms').innerHTML=['',...P].map(q=>{const rs=a.filter(r=>(r.piece||'')==q),d=rs.filter(r=>r.done).length,pc=rs.length?Math.round(d/rs.length*100):0;
 return '<div class="card"><div class="row"><div class="tt"><b>'+esc(q||TE)+'</b><div class="info">'+pc+' % fait ('+d+'/'+rs.length+')</div><div class="info">'+totTxt(sums(rs))+'</div></div>'+
 (q?'<button class="tg" data-a="pren" data-n="'+esc(q)+'" aria-label="Modifier la pièce">✏️</button><button class="tg" data-a="pdel" data-n="'+esc(q)+'" aria-label="Supprimer la pièce" style="background:#fce8e6;color:#c5221f">🗑</button>':'')+'</div>'+
 rs.map(r=>'<div class="row sub'+(r.done?' done':'')+'"><input type="checkbox" class="ck" data-a="ck" data-n="'+r.n+'" '+(r.done?'checked':'')+' aria-label="Fait"><div class="tt"><span class="num">'+r.n+'</span> '+esc(r.t)+'</div></div>').join('')+'</div>'}).join('')+
 '<div class="card"><div class="row"><button class="p" style="flex:1" data-a="padd">+ Ajouter une pièce</button></div></div>'}
function render(){const shown=[...document.querySelectorAll('.det:not(.hide)')].map(e=>e.id).filter(Boolean);
 $('#list').innerHTML=S.map(m=>'<div class="card">'+row(m,1)+'<div class="'+(open[m.n]?'':'hide')+'">'+m.subs.map(s=>row(s,0)).join('')+'<div class="row sub"><button data-a="add" data-n="'+m.n+'">+ Ajouter une sous-tâche</button></div></div></div>').join('')+'<div class="card"><div class="row"><button class="p" style="flex:1" data-a="addm">+ Ajouter une étape</button></div></div>';
 shown.forEach(id=>{const e=document.getElementById(id);e&&e.classList.remove('hide')});contacts();rooms();stats();gantt()}
function gantt(){const t0=D('2026-09-28'),t1=D('2027-09-30'),W=[];for(let d=new Date(t0);d<=t1;d.setDate(d.getDate()+7))W.push(new Date(d));
 let h='<table><tr><th class="n">Étape</th>'+W.map(w=>'<th>'+w.getDate()+'/'+(w.getMonth()+1)+'</th>').join('')+'</tr>';
 all().forEach(r=>{const a=D(r.start),b=D(r.end),ea=D(r.estStart),eb=D(r.estEnd),sub=String(r.n).includes('.');
  h+='<tr class="'+(sub?'s':'')+'"><td class="n" title="'+esc(r.t)+'">'+r.n+' '+esc(r.t)+'</td>'+W.map(w=>{const we=new Date(w);we.setDate(we.getDate()+6);
  return '<td class="'+(a&&b&&a<=we&&b>=w?'f'+(r.done?' d':''):(ea&&eb&&ea<=we&&eb>=w?'e':''))+'"></td>'}).join('')+'</tr>'});
 $('#gantt').innerHTML=h+'</table>'}
const effEnd=m=>m.end||m.estEnd;
function setShown(r){['estStart','estEnd'].forEach(f=>{const el=document.querySelector('[data-f="'+f+'"][data-n="'+r.n+'"]');if(el)el.value=r[f]||''});const y=document.getElementById('e'+r.n);if(y)y.textContent=dur(r,1)||'—'}
function shift(n,k,seen=new Set([n])){S.forEach(m=>{if(m.dep==n&&!seen.has(m.n)){seen.add(m.n);m.estStart=addDays(m.estStart,k);m.estEnd=addDays(m.estEnd,k);setShown(m);shift(m.n,k,seen)}})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const n=t.dataset.n,a=t.dataset.a;
 if(a=='ck'){snap();const r=find(n);r.done=!r.done;save();render()}
 if(a=='add'){const m=S.find(x=>x.n==n),t=prompt('Texte de la nouvelle sous-tâche :');if(t&&t.trim()){snap();const k=Math.max(0,...m.subs.map(x=>parseInt(String(x.n).split('.')[1])||0))+1;m.subs.push({n:m.n+'.'+k,t:t.trim(),done:false,start:'',end:'',estStart:'',estEnd:'',prevu:'',depense:'',note:''});open[m.n]=true;save();render()}}
 if(a=='addm'){const t=prompt('Nom de la nouvelle étape :');if(t&&t.trim()){snap();const k=Math.max(0,...S.map(x=>parseInt(x.n)||0))+1;S.push({n:String(k),t:t.trim(),qui:'',est:'',budgetTxt:'',prevu:'',depense:'',done:false,start:'',end:'',estStart:'',estEnd:'',note:'',dep:'',contact:'',subs:[]});save();render()}}
 if(a=='ren'){const r=find(n),t=prompt('Nouveau nom :',r.t);if(t&&t.trim()&&t.trim()!==r.t){snap();r.t=t.trim();save();render()}}
 if(a=='del'&&S.some(x=>x.n==n)){if(confirm("Es-tu sûre de vouloir supprimer l'étape "+n+" ? Ça va supprimer l'étape ET toutes ses sous-étapes.")){snap();S=S.filter(x=>x.n!=n);S.forEach(m=>{if(m.dep==n)m.dep=''});save();render()}return}
 if(a=='del'){const m=S.find(x=>x.subs.some(y=>y.n==n));if(m&&confirm('Supprimer la sous-tâche '+n+' ? (Annuler possible avec ↶)')){snap();m.subs=m.subs.filter(y=>y.n!=n);save();render()}}
 if(a=='det')document.getElementById('d'+n).classList.toggle('hide');
 if(a=='op'){open[n]=!open[n];localStorage.setItem(KEY+'.open',JSON.stringify(open));render()}
 if(a=='cadd'){const t=prompt('Nom du contact :');if(t&&t.trim()){snap();const id='c'+Date.now();C.push({id,metier:'',nom:t.trim(),tel:'',email:'',note:''});cedit[id]=true;save();render()}}
 if(a=='padd'){const t=prompt('Nom de la nouvelle pièce :');if(t&&t.trim()&&!P.includes(t.trim())){snap();P.push(t.trim());save();render()}}
 if(a=='pren'){const t=prompt('Nouveau nom de la pièce :',n);if(t&&t.trim()&&t.trim()!==n&&!P.includes(t.trim())){snap();P=P.map(q=>q==n?t.trim():q);all().forEach(r=>{if(r.piece==n)r.piece=t.trim()});save();render()}}
 if(a=='pdel'){if(confirm('Es-tu sûre de vouloir supprimer la pièce « '+n+' » ? Ses tâches vont aller dans « '+TE+' ».')){snap();P=P.filter(q=>q!=n);all().forEach(r=>{if(r.piece==n)r.piece=''});save();render()}}
 if(a=='cedit'){cedit[n]=!cedit[n];contacts()}
 if(a=='cdone'){cedit[n]=false;contacts()}
 if(a=='cdel'){const c=C.find(x=>x.id==n);if(c&&confirm('Es-tu sûre de vouloir supprimer le contact « '+(c.nom||'')+' » ?')){snap();C=C.filter(x=>x.id!=n);S.forEach(m=>{if(m.contact==n)m.contact=''});save();render()}}});
let typing=null;
document.addEventListener('focusin',e=>{if(e.target.dataset.f||e.target.dataset.c)typing=st()});
document.addEventListener('input',e=>{const c=e.target.dataset.c;if(c){const o=C.find(x=>x.id==e.target.dataset.n);if(o){o[c]=e.target.value;save()}return}
 const f=e.target.dataset.f;if(!f)return;const r=find(e.target.dataset.n);const isMain=S.includes(r),old=r[f];r[f]=e.target.value;
 if(isMain&&(f=='estEnd'||f=='end')){const a=D(old),b=D(r[f]);if(a&&b&&b.getFullYear()>2000&&b.getFullYear()<2100){const k=Math.round((b-a)/864e5);if(k>0&&k<1000)shift(r.n,k)}}
 save();const x=document.getElementById('r'+r.n);if(x)x.textContent=dur(r)||'—';const y=document.getElementById('e'+r.n);if(y)y.textContent=dur(r,1)||'—';stats();if(/start|end/i.test(f))gantt()});

 if(e.target.tagName=='SELECT'||d.c){render()}});
